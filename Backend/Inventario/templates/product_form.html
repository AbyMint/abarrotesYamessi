{% extends 'base.html' %}
{% block content %}
<section class="section">
  <h1>{% if product %}Edit{% else %}Add{% endif %} product</h1>
  <form method="post" action="{% if product %}/products/edit/{{ product.id }}{% else %}/products/add{% endif %}">
    <label>SKU<input name="sku" value="{{ product.sku if product else '' }}" required></label>
    <label>Name<input name="name" value="{{ product.name if product else '' }}" required></label>
    <label>Category<input name="category" value="{{ product.category if product else '' }}"></label>
    <label>Subcategory<input name="subcategory" value="{{ product.subcategory if product else '' }}"></label>
    <label>Cost price<input name="cost_price" type="number" step="0.01" value="{{ product.cost_price if product else '0.00' }}"></label>
    <label>Sale price<input name="sale_price" type="number" step="0.01" value="{{ product.sale_price if product else '0.00' }}"></label>
    <div class="actions">
      <button type="submit">{{ t('common.save') }}</button>
      <a class="pill-link" href="{{ url_with_prefs('/products') }}">{{ t('common.cancel') }}</a>
    </div>
  </form>
</section>
{% endblock %}
