{% extends 'base.html' %}
{% block content %}
<section class="section">
  <div class="actions" style="justify-content:space-between;">
    <h1 style="margin:0;">{{ t('suppliers.title') }}</h1>
    <a class="button-primary" href="{{ url_with_prefs('/suppliers/add') }}">{{ t('suppliers.add') }}</a>
  </div>
</section>

<section class="section table-wrap">
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Contact</th>
        <th>Phone</th>
        <th>Address</th>
      </tr>
    </thead>
    <tbody>
      {% for s in suppliers %}
      <tr>
        <td>{{ s.name }}</td>
        <td>{{ s.contact }}</td>
        <td>{{ s.phone }}</td>
        <td>{{ s.address }}</td>
      </tr>
      {% else %}
      <tr>
        <td colspan="4">{{ t('suppliers.none') }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
